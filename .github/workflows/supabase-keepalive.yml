name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive table
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "https://byffbedmxguxbdfhfhvg.supabase.co/rest/v1/keepalive?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          
          echo "HTTP status: $status"
          echo "Response body: $body"
          
          if [ "$status" -ne 200 ]; then
            echo "Ping failed with status $status"
            exit 1
          fi
          
          echo "Supabase pinged successfully"